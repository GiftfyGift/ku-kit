<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="ringGrad" x1="10%" y1="15%" x2="90%" y2="85%">
      <stop offset="0%" stop-color="#2f5bff"/>
      <stop offset="50%" stop-color="#57d6ff"/>
      <stop offset="100%" stop-color="#33e6e0"/>
    </linearGradient>
    <filter id="ringGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="41" fill="none" stroke="url(#ringGrad)" stroke-width="6" filter="url(#ringGlow)"/>
</svg>
